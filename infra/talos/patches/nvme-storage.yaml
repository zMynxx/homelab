---
# Propagate the Talos UserVolumeConfig mount (/var/mnt/longhorn) into the
# kubelet mount namespace so Longhorn hostPath volumes see the NVMe partition.
# rshared ensures sub-mounts (Longhorn iSCSI devices) propagate back out.
machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
---
# Talos UserVolumeConfig — provisions /dev/nvme0n1p1 (XFS) and mounts it at
# /var/mnt/longhorn. Default mountPoint for name "longhorn" is /var/mnt/longhorn.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  minSize: 10GB
  grow: true
