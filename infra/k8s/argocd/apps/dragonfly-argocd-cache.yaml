apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dragonfly-argocd-cache
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zMynxx/homelab.git
    targetRevision: main
    path: infra/k8s/dragonfly
    directory:
      include: "argocd-cache.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
