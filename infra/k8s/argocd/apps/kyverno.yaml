apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: "3.9.0"
    helm:
      valueFiles:
      - $values/infra/k8s/kyverno/values.yaml
  - repoURL: https://github.com/zmynxx/homelab.git
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
