apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-istio-csr
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://charts.jetstack.io
    chart: cert-manager-istio-csr
    targetRevision: "v0.17.0"
    helm:
      valueFiles:
      - $values/infra/k8s/cert-manager/istio-csr-values.yaml
  - repoURL: https://github.com/zmynxx/homelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
