---
# Automatically enroll namespaces in Istio Ambient mesh (mTLS via ztunnel).
# Excluded: Kubernetes internals, Istio control plane, Cilium, Kyverno (webhook timing),
# and Longhorn (iSCSI/gRPC internal networking).
#
# NOTE: The exclude block handles admission (new namespaces). The targets.selector
# handles mutateExistingOnPolicyUpdate (existing namespaces). Both are required.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-istio-ambient-label
spec:
  mutateExistingOnPolicyUpdate: true
  rules:
    - name: add-ambient-label
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - istio-system
                - cilium-secrets
                - kyverno
                - longhorn-system
                - longhorn-mount
      mutate:
        targets:
          - apiVersion: v1
            kind: Namespace
            selector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - kube-public
                    - kube-node-lease
                    - istio-system
                    - cilium-secrets
                    - kyverno
                    - longhorn-system
                    - longhorn-mount
        patchStrategicMerge:
          metadata:
            labels:
              istio.io/dataplane-mode: ambient
