---
# Add lior to all groups - run this AFTER user-lior.yaml is created
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: grafana-users
  namespace: kanidm
spec:
  kanidmRef:
    name: kanidm
  name: grafana_users
  displayName: Grafana Users
  members:
    - lior

