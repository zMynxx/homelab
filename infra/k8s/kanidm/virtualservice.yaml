---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kanidm
  namespace: kanidm
spec:
  hosts:
    - kanidm.opnsense.internal
  gateways:
    - istio-ingress/main
  http:
    - route:
        - destination:
            host: kanidm.kanidm.svc.cluster.local
            port:
              number: 8443

