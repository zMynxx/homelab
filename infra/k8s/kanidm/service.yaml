---
# Separate LoadBalancer for external access. kaniop owns the headless "kanidm" service
# internally; this one gets the Cilium IPAM IP for Caddy and LDAP clients.
apiVersion: v1
kind: Service
metadata:
  name: kanidm-external
  namespace: kanidm
  annotations:
    lbipam.cilium.io/ips: "192.168.30.201"
spec:
  type: LoadBalancer
  selector:
    kanidm.kaniop.rs/cluster: kanidm
  ports:
    - name: https
      port: 8443
      targetPort: 8443
    - name: ldap
      port: 3636
      targetPort: 3636
