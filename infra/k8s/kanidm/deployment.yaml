---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanidm
  namespace: kanidm
  labels:
    app.kubernetes.io/name: kanidm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kanidm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanidm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kanidm
          image: kanidm/server:1.4.3
          env:
            - name: KANIDM_CONFIG
              value: /etc/kanidm/server.toml
          ports:
            - name: https
              containerPort: 8443
            - name: ldap
              containerPort: 3636
          volumeMounts:
            - name: config
              mountPath: /etc/kanidm/server.toml
              subPath: server.toml
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /certs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: kanidm-config
        - name: data
          persistentVolumeClaim:
            claimName: kanidm-data
        - name: tls
          secret:
            secretName: kanidm-tls
