---
# Cilium LoadBalancer IP pool — reserves 192.168.30.200–.214 for LoadBalancer services.
# Services with type: LoadBalancer get an IP from this range automatically.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-pool
spec:
  blocks:
    - cidr: 192.168.30.200/28
