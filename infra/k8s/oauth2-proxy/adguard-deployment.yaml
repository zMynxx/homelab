---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-adguard
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy-adguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-adguard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://kanidm.kanidm.svc.cluster.local:8443/oauth2/openid/adguard
            - --insecure-oidc-skip-issuer-verification=true
            - --client-id=adguard
            - --redirect-url=https://adguard.opnsense.internal/oauth2/callback
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-domain=.opnsense.internal
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_oauth2_proxy_adguard
            - --scope=openid email profile
            - --ssl-insecure-skip-verify=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --whitelist-domain=.opnsense.internal
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-adguard-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-adguard-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
