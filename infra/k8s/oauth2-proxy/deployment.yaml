---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            # Kanidm OIDC issuer: https://<domain>/oauth2/openid/<client-name>
            - --oidc-issuer-url=https://kanidm.kanidm.svc.cluster.local:8443/oauth2/openid/oauth2-proxy
            - --client-id=oauth2-proxy
            - --redirect-url=https://oauth2-proxy.opnsense.internal/oauth2/callback
            # forward_auth mode: return 200/401 without proxying upstream
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-domain=.opnsense.internal
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_oauth2_proxy_homelab
            - --scope=openid email profile
            # Kanidm cert signed by homelab-ca (istio-ca intermediate) — skip verify for internal cluster traffic
            - --ssl-insecure-skip-verify=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
