---
# Zot registry configuration. Mounted at /etc/zot/config.yaml.
# Serves HTTPS on :5000 (cert from cert-manager, see certificate.yaml).
#
# Pull-through caching is done via the `sync` extension with onDemand: true for
# each upstream. When containerd requests an image from Zot, Zot fetches it from
# the matching upstream and caches it; subsequent pulls are served locally.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  config.yaml: |
    distSpecVersion: 1.1.1

    storage:
      rootDirectory: /var/lib/registry
      gc: true
      dedupe: true

    log:
      level: info

    http:
      address: 0.0.0.0
      port: 5000
      tls:
        cert: /etc/zot/tls/tls.crt
        key: /etc/zot/tls/tls.key
      # Serve Docker-format manifests so Docker/containerd clients work.
      compat: ["docker2s2"]

    extensions:
      sync:
        enable: true
        registries:
          - urls: ["https://docker.io"]
            onDemand: true
            tlsVerify: true
            maxRetries: 3
            retryDelay: "5m"
          - urls: ["https://ghcr.io"]
            onDemand: true
            tlsVerify: true
          - urls: ["https://quay.io"]
            onDemand: true
            tlsVerify: true
          - urls: ["https://registry.k8s.io"]
            onDemand: true
            tlsVerify: true
