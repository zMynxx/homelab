---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
      annotations:
        # Ambient mode: stop ztunnel from intercepting :5000. containerd (a
        # host-level process, not a mesh pod) reaches Zot directly, so the pod
        # must be excluded from mesh redirection or the connection is dropped.
        ambient.istio.io/redirection: disabled
        traffic.sidecar.istio.io/excludeInboundPorts: "5000"
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.20
          args: ["serve", "/etc/zot/config.yaml"]
          ports:
            - name: registry
              containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.yaml
              subPath: config.yaml
            - name: tls
              mountPath: /etc/zot/tls
            - name: storage
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: tls
          secret:
            secretName: zot-tls
        - name: storage
          # Ephemeral cache for the scaffold. Replace with a Longhorn PVC once
          # the storage layer is deployed so the cache survives pod restarts.
          emptyDir: {}
