---
# Shared PostgreSQL cluster — foundation for future apps (Grafana, Gitea, etc.)
# Add Role + Database CRDs per-app when needed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab-db
  namespace: databases
spec:
  instances: 3
  storage:
    size: 5Gi
    storageClass: longhorn
  superuserSecret:
    name: homelab-db-superuser
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
