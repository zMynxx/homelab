---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab-db
  namespace: databases
spec:
  instances: 3
  storage:
    size: 5Gi
    storageClass: longhorn
  superuserSecret:
    name: homelab-db-superuser
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
---
# Role + Database for Authelia
apiVersion: postgresql.cnpg.io/v1
kind: Role
metadata:
  name: authelia
  namespace: databases
spec:
  cluster:
    name: homelab-db
  name: authelia
  passwordSecret:
    name: authelia-db-credentials
    key: password
  login: true
  superuser: false
  createDb: false
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authelia
  namespace: databases
spec:
  cluster:
    name: homelab-db
  name: authelia
  owner: authelia
---
# Role + Database for LLDAP
apiVersion: postgresql.cnpg.io/v1
kind: Role
metadata:
  name: lldap
  namespace: databases
spec:
  cluster:
    name: homelab-db
  name: lldap
  passwordSecret:
    name: lldap-db-credentials
    key: password
  login: true
  superuser: false
  createDb: false
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lldap
  namespace: databases
spec:
  cluster:
    name: homelab-db
  name: lldap
  owner: lldap
