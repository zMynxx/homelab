# SOPS configuration
# Encryption key: age post-quantum key (ML-KEM + X25519 hybrid, age v1.3.1+)
# Private key stored locally at: key.txt.secret (gitignored)
# Standard location: ~/.config/sops/age/keys.txt
#
# To set up on a new machine:
#   mkdir -p ~/.config/sops/age
#   cp key.txt.secret ~/.config/sops/age/keys.txt
#
# To encrypt a new file:
#   sops --encrypt file.yaml > file.sops.yaml
#
# To decrypt:
#   sops --decrypt file.sops.yaml

creation_rules:
  # All *.sops.yaml files anywhere in the repo
  - path_regex: .*\.sops\.yaml$
    age: >-
      

  # Binary/non-YAML backups (XML configs, binary dumps) encrypted with --input-type binary
  - path_regex: .*\.sops\.bin$
    age: >-
      

  # Kubernetes Secret manifests in gitops/
  - path_regex: gitops/.*secret.*\.yaml$
    age: >-
      
