apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
helmCharts:
  - name: &name argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.4.2
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
resources:
  - caddy-local-ca-cm.yaml
  - dex-tls-cert.yaml
