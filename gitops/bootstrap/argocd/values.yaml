# ArgoCD — GitOps engine for the homelab
# Helm chart: argo/argo-cd v10.4.2 (ArgoCD v3.5.2)
#
# SOPS secret decryption is handled by sops-secrets-operator (not ArgoCD).
# ArgoCD applies SopsSecret CRDs; the operator decrypts them into K8s Secrets.
# Bootstrap: kubectl create secret generic sops-age-key -n sops-secrets-operator \
#              --create-namespace --from-file=key.txt=key.txt.secret

global:
  image:
    tag: "v3.5.2"
  # Disable Helm-generated NetworkPolicies — Istio Ambient mTLS enforces
  # access control via SPIFFE identity (AuthorizationPolicy).
  networkPolicy:
    create: false

# Explicitly disable per-component NetworkPolicies (global flag not sufficient
# in chart v10.x — component-level values override global)
applicationController:
  networkPolicy:
    create: false

configs:
  params:
    # TLS terminated by Istio ambient mesh — run server in plain HTTP mode
    server.insecure: "true"
    kustomize.buildOptions: "--enable-helm"
    repo.server: "argocd-repo-server.argocd.svc.cluster.local:8081"
    # DragonflyDB Redis-compatible cache (3-replica cluster in argocd namespace)
    redis.server: "argocd-cache.argocd.svc.cluster.local:6379"

  cm:
    url: "https://argocd.opnsense.internal"
    dex.config: |
      connectors:
      - type: oidc
        id: kanidm
        name: Kanidm
        config:
          issuer: https://kanidm.opnsense.internal/oauth2/openid/argocd
          clientID: argocd
          clientSecret: $argocd-oidc-kanidm:clientSecret
          redirectURI: https://argocd.opnsense.internal/api/dex/callback
          scopes:
            - openid
            - email
            - profile
            - groups
          rootCAs:
            - /etc/ssl/caddy-ca/ca.crt
          enablePKCE: true

  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, argocd-users@kanidm.opnsense.internal, role:admin
    scopes: '[groups, email]'

# ── repo-server ───────────────────────────────────────────────────────────────
repoServer:
  networkPolicy:
    create: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

# ── other components ──────────────────────────────────────────────────────────
server:
  networkPolicy:
    create: false
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "192.168.30.202"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

notifications:
  networkPolicy:
    create: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Redis disabled — replaced by DragonflyDB (argocd-cache CR in argocd namespace)
redis:
  enabled: false

# Dex — OIDC intermediary for Kanidm SSO (handles PKCE that ArgoCD native OIDC lacks)
dex:
  enabled: true
  logLevel: debug
  volumes:
    - name: caddy-local-ca
      configMap:
        name: argocd-caddy-local-ca
  volumeMounts:
    - name: caddy-local-ca
      mountPath: /etc/ssl/caddy-ca
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
