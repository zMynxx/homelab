---
# Grants kyverno-background-controller permission to patch Namespaces,
# required for mutateExistingOnPolicyUpdate on the add-istio-ambient-label policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-background-controller-namespace-mutate
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-background-controller-namespace-mutate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-background-controller-namespace-mutate
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
