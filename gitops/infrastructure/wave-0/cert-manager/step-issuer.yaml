---
# ClusterIssuer backed by TinyCA (step-ca) ACME. Certificates chain to the
# Homelab Root CA (YubiKey-backed). caBundle trusts step-ca's self-signed TLS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-issuer
spec:
  acme:
    server: https://192.168.10.37:8443/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-account-key
    caBundle: 
    solvers:
      - http01:
          ingress:
            class: istio
