# Kyverno — policy engine / admission controller (CKS security layer)
#
# Chart:  kyverno/kyverno
# Repo:   helm repo add kyverno https://kyverno.github.io/kyverno/
#
# Deployed in SyncWave 1 (security). Policies live in kyverno/policies/.
# PodSecurity exemption for the kyverno namespace is already added in
# infra/talos/patches/controlplane.yaml.

namespace: kyverno

# HA: run 2 replicas of each controller on a 3-node cluster.
admissionController:
  replicas: 2
  # Kyverno generates its own webhook certs; no step-ca integration needed.
  hostNetwork: false
backgroundController:
  replicas: 2
reportsController:
  replicas: 2

resources:
  admissionController:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backgroundController:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Do not block the kube-system namespace by default.
excludeKubeSystem: true

# Admission reports make violations visible via `kubectl get admissionreport`.
reports:
  enabled: true
