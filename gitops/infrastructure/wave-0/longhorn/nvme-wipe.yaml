apiVersion: v1
kind: Namespace
metadata:
  name: disk-wipe
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvme-wipe
  namespace: disk-wipe
spec:
  selector:
    matchLabels:
      app: nvme-wipe
  template:
    metadata:
      labels:
        app: nvme-wipe
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: wipe
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["sh", "-c", "dd if=/dev/zero of=/dev/nvme0n1 bs=1M count=16 2>&1; echo WIPED-$(hostname); sleep 3600"]
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: dev
          hostPath:
            path: /dev
      restartPolicy: Always
