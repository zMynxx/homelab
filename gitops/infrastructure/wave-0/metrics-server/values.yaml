---
# Talos kubelet uses self-signed certs — insecure-tls is required for metrics-server to scrape.
# Nodes must be addressed by InternalIP because Talos hostnames are not guaranteed to resolve.
args:
  - --kubelet-insecure-tls

defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP
  - --kubelet-use-node-status-port
  - --metric-resolution=15s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
