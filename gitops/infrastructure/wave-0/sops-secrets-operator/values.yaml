# Age key mounted from a Secret created during bootstrap (before ArgoCD syncs):
#   kubectl create secret generic sops-age-key \
#     -n sops-secrets-operator --create-namespace \
#     --from-file=key.txt=key.txt.secret
secretsAsFiles:
  - name: age-key
    mountPath: /tmp/sops-age
    secretName: sops-age-key

extraEnv:
  - name: SOPS_AGE_KEY_FILE
    value: /tmp/sops-age/key.txt

securityContext:
  enabled: true
  runAsUser: 13001
  runAsGroup: 13001
  runAsNonRoot: true
  fsGroup: 13001
  seccompProfileType: RuntimeDefault
  container:
    enabled: true
    capabilities:
      drop:
        - ALL
      add: []
    customContainerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 13001
      runAsGroup: 13001
      privileged: false

defaultEnforceOwnership: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
